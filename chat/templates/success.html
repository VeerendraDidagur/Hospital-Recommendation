<!DOCTYPE html>
<html>
<head>
    <title>Appointment Success</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .card {
            background: white;
            padding: 30px 45px;
            border-radius: 15px;
            box-shadow: 0px 6px 18px rgba(0, 0, 0, 0.15);
        }
        h1 {
            color: #28a745;
            font-size: 32px;
            margin-bottom: 8px;
        }
        h2 {
            color: #333;
            font-size: 26px;
            margin-top: 0;
        }
        p {
            font-size: 20px;
            margin-top: 12px;
        }
        a {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
        }
        a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎉 Congratulations!</h1>
        <h2>Appointment Booked Successfully ✔️</h2>
        <p id="appt"></p>
        <a href="/index">Go Home</a>
    </div>

    <script>
        let time = sessionStorage.getItem("appointment_time");
        if (time) {
            document.getElementById("appt").innerText = "⏰ Selected Time: " + time;
        }
    </script>

</body>
</html>
