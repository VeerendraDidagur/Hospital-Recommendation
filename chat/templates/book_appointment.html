<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment - {{ doctor.name }}</title>
    <style>
        body {
            background:#f8f9fa;
            font-family: Arial, sans-serif;
            padding:20px;
        }

        /* Doctor section row left image + right details */
        .top-section {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 30px;
        }

        .doctor-img {
            border-radius: 12px;
            width: 260px;
            height: 200px;
            object-fit: cover;
        }

        .doctor-info {
            font-size: 18px;
        }

        /* Booking card */
        .card {
            background:white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            width: 75%;
            margin: auto;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align:center;
        }

        .clinic {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            margin-bottom: 18px;
        }

        /* Today / Tomorrow buttons */
        .day-btn {
            padding: 8px 20px;
            margin: 5px;
            border-radius: 6px;
            border: 1px solid #007bff;
            background: white;
            cursor: pointer;
        }
        .day-btn.active {
            background: #007bff;
            color: white;
        }

        .slots {
            margin-top: 15px;
            text-align:center;
        }

        .slot-btn {
            padding: 8px 18px;
            margin: 5px;
            background: white;
            border-radius: 6px;
            border: 1px solid #28a745;
            cursor: pointer;
        }

        .slot-btn:hover {
            background:#28a745;
            color:white;
        }

        /* Confirm button */
        #confirmBtn {
            background: grey;
            color: white;
            border: none;
            padding: 11px 26px;
            border-radius: 8px;
            font-size: 18px;
            cursor: not-allowed;
            display:block;
            margin: 18px auto 0;
        }

        #confirmBtn.enabled {
            background: #28a745;
            cursor: pointer;
        }
    </style>

    <script>
        function showSlots(day) {
            document.getElementById("today").classList.remove("active");
            document.getElementById("tomorrow").classList.remove("active");
            document.getElementById(day).classList.add("active");

            document.getElementById("slot-today").style.display = day === "today" ? "block" : "none";
            document.getElementById("slot-tomorrow").style.display = day === "tomorrow" ? "block" : "none";
        }
    </script>
</head>
<body>

    <!-- Doctor Details -->
    <div class="top-section">
        <img src="{{ doctor.image }}" class="doctor-img">

        <div class="doctor-info">
            <b style="font-size:24px;">{{ doctor.name }}</b><br><br>
            <b>Specialist:</b> {{ doctor.specialties }} <br>
            <b>Experience:</b> {{ doctor.experience }} years <br>
            <b>Rating:</b> ⭐ {{ doctor.rating }} <br>
            <b>Qualification:</b> {{ doctor.qualification }}
        </div>
    </div>

    <!-- Appointment Card -->
    <div class="card">
        <div class="title">Book Clinic Visit</div>

        <div class="clinic">
            <span><b>Clinic:</b> {{ clinic.name }}</span>
            <span><b>Fee:</b> ₹{{ clinic.fee }}</span>
        </div>

        <button id="today" class="day-btn active" onclick="showSlots('today')">Today</button>
        <button id="tomorrow" class="day-btn" onclick="showSlots('tomorrow')">Tomorrow</button>

        <!-- Time Slots -->
        <div id="slot-today" class="slots">
            <button class="slot-btn" onclick="selectSlot('10:00 AM', event)">10:00 AM</button>
            <button class="slot-btn" onclick="selectSlot('12:30 PM', event)">12:30 PM</button>
            <button class="slot-btn" onclick="selectSlot('4:00 PM', event)">4:00 PM</button>
            <button class="slot-btn" onclick="selectSlot('6:15 PM', event)">6:15 PM</button>
        </div>

        <div id="slot-tomorrow" class="slots" style="display:none;">
            <button class="slot-btn" onclick="selectSlot('9:30 AM', event)">9:30 AM</button>
            <button class="slot-btn" onclick="selectSlot('11:45 AM', event)">11:45 AM</button>
            <button class="slot-btn" onclick="selectSlot('3:20 PM', event)">3:20 PM</button>
            <button class="slot-btn" onclick="selectSlot('7:00 PM', event)">7:00 PM</button>
        </div>   

        <button id="confirmBtn" disabled onclick="confirmAppointment()">Confirm Appointment</button>
    </div>

<script>
    let selectedTime = "";

    function selectSlot(time, event) {
        selectedTime = time;

        document.querySelectorAll(".slot-btn").forEach(btn => {
            btn.style.background = "white";
            btn.style.color = "black";
        });

        event.target.style.background = "#28a745";
        event.target.style.color = "white";

        document.getElementById("confirmBtn").disabled = false;
        document.getElementById("confirmBtn").classList.add("enabled");

        sessionStorage.setItem("appointment_time", time);
    }

    function confirmAppointment() {
        window.location.href = "/success";
    }
</script>

</body>
</html>
