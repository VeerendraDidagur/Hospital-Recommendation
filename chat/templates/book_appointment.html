<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment - {{ doctor.name }}</title>
    <style>
        body { background:#f8f9fa; font-family: Arial, sans-serif; padding:20px; }

        .top-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .doctor-img {
            border-radius: 12px;
            width: 230px;
            height: 170px;
            object-fit: cover;
        }

        .doctor-info {
            font-size: 18px;
            margin-top: 10px;
        }

        .card {
            background:white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            width: 70%;
            margin: auto;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .clinic {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            margin-bottom: 18px;
        }

        .day-btn {
            padding: 8px 20px;
            margin: 5px;
            border-radius: 6px;
            border: 1px solid #007bff;
            background: white;
            cursor: pointer;
        }

        .day-btn.active {
            background: #007bff;
            color: white;
        }

        .slots {
            margin-top: 15px;
        }

        .slot-btn {
            padding: 8px 18px;
            margin: 5px;
            background: white;
            border-radius: 6px;
            border: 1px solid #28a745;
            cursor: pointer;
        }

        .slot-btn.selected {
            background:#28a745;
            color:white;
        }

        #confirmBtn {
            margin-top: 20px;
            padding: 10px 20px;
            background: grey;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: not-allowed;
        }

        #confirmBtn.enabled {
            background: #28a745;
            cursor: pointer;
        }
    </style>

    <script>
        function showSlots(day) {
            document.getElementById("today").classList.remove("active");
            document.getElementById("tomorrow").classList.remove("active");
            document.getElementById(day).classList.add("active");

            document.getElementById("slot-today").style.display = day === "today" ? "block" : "none";
            document.getElementById("slot-tomorrow").style.display = day === "tomorrow" ? "block" : "none";
        }

        function selectSlot(time, btn) {
            document.getElementById("selected_time").value = time;

            let buttons = document.querySelectorAll(".slot-btn");
            buttons.forEach(b => b.classList.remove("selected"));

            btn.classList.add("selected");

            // enable confirm button
            let confirmBtn = document.getElementById("confirmBtn");
            confirmBtn.disabled = false;
            confirmBtn.classList.add("enabled");
        }
    </script>
</head>
<body>

    <div class="top-section">
        <img src="{{ doctor.image }}" class="doctor-img">
        <div class="doctor-info">
            <b>{{ doctor.name }}</b><br>
            {{ doctor.specialties }} <br>
            {{ doctor.experience }} years • ⭐ {{ doctor.rating }} <br>
            {{ doctor.qualification }}
        </div>
    </div>

    <div class="card">
        <div class="title">Book Clinic Visit</div>

        <div class="clinic">
            <span><b>Clinic:</b> {{ clinic.name }}</span>
            <span><b>Fee:</b> ₹{{ clinic.fee }}</span>
        </div>

        <button id="today" class="day-btn active" onclick="showSlots('today')">Today</button>
        <button id="tomorrow" class="day-btn" onclick="showSlots('tomorrow')">Tomorrow</button>


        <!-- TODAY SLOTS -->
        <div id="slot-today" class="slots">
            <button class="slot-btn" onclick="selectSlot('10:00 AM', this)">10:00 AM</button>
            <button class="slot-btn" onclick="selectSlot('12:30 PM', this)">12:30 PM</button>
            <button class="slot-btn" onclick="selectSlot('4:00 PM', this)">4:00 PM</button>
            <button class="slot-btn" onclick="selectSlot('6:15 PM', this)">6:15 PM</button>
        </div>

        <!-- TOMORROW SLOTS -->
        <div id="slot-tomorrow" class="slots" style="display:none;">
            <button class="slot-btn" onclick="selectSlot('9:30 AM', this)">9:30 AM</button>
            <button class="slot-btn" onclick="selectSlot('11:45 AM', this)">11:45 AM</button>
            <button class="slot-btn" onclick="selectSlot('3:20 PM', this)">3:20 PM</button>
            <button class="slot-btn" onclick="selectSlot('7:00 PM', this)">7:00 PM</button>
        </div>

        <br>

        <!-- Submits to Flask -->
        <form action="/confirm_appointment" method="POST">

            <input type="hidden" name="doctor_id" value="{{ doctor.id }}">
            <input type="hidden" name="clinic_name" value="{{ clinic.name }}">
            <input type="hidden" name="hospital_id" value="{{ hospital_id }}">
            <input type="hidden" id="selected_time" name="timeslot">

            <button id="confirmBtn" disabled>
                Confirm Appointment
            </button>
        </form>

    </div>

</body>
</html>
